<!doctype html>
<!-- A recreation of the ez-annotate UI with sample content, for docs/demo.gif and preview.png.
     Re-render: node docs/demo/render.mjs   (open this file with #t=8.4 to see one moment) -->
<html>
<head>
<meta charset="utf-8">
<title>ez-annotate demo</title>
<style>
  :root {
    --chrome: #101114; --pane: #17191d; --border: #2d2f32; --raised: #1e2023; --input: #2e3034;
    --selected: #262629; --popover: #1d1f23; --fg: #e4e4e7; --muted: #a1a1aa; --dim: #71747c;
    --accent: #8fabd2; --solid: #eeeeef; --done: #98c379; --blocked: #e06c75;
    --t-fg: #cdd6f4; --t-dim: #7f849c; --t-blue: #89b4fa; --t-green: #a6e3a1; --t-red: #f38ba8;
    --t-yellow: #f9e2af; --t-mauve: #cba6f7; --claude: #d97757;
    --sans: "Inter", "Adwaita Sans", system-ui, sans-serif;
    --mono: "JetBrains Mono", "JetBrainsMono Nerd Font", "Adwaita Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1000px; height: 560px; overflow: hidden; background: var(--chrome); }
  body { font: 10px/1.35 var(--sans); color: var(--fg); position: relative; -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .row { display: flex; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  #app { display: flex; width: 1000px; height: 560px; }

  /* sidebar */
  #side { width: 182px; border-right: 1px solid #1c1e21; display: flex; flex-direction: column; padding: 0 6px; }
  .brand { height: 34px; gap: 8px; padding: 0 6px; font-size: 10.5px; font-weight: 500; }
  .brand .ico { color: var(--muted); }
  .label { color: var(--dim); font-size: 8.5px; padding: 8px 6px 4px; }
  .space { height: 22px; gap: 8px; padding: 0 6px; border-radius: 6px; font-size: 10px; }
  .space.on { background: var(--selected); }
  .badge { width: 13px; height: 13px; border-radius: 3px; font-size: 7.5px; font-weight: 600; display: grid; place-items: center; color: #0b0c0e; }
  .agents { margin-top: auto; border-top: 1px solid #1c1e21; padding-top: 6px; margin-bottom: 8px; }
  .group { font-size: 8.5px; padding: 8px 6px 3px; }
  .agent { height: 22px; gap: 6px; padding: 0 6px; border-radius: 6px; font-size: 10px; white-space: nowrap; }
  .agent .sub { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .agent .age { color: var(--dim); font-size: 8.5px; }
  .foot { border-top: 1px solid #1c1e21; padding: 6px 0 8px; }
  .foot .agent { color: var(--muted); }

  /* main */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #top { height: 31px; gap: 6px; padding: 0 6px; }
  .tab { height: 21px; padding: 0 8px; gap: 6px; border-radius: 5px; font-size: 10px; }
  .tab.on { background: var(--raised); border: 1px solid #2c2e31; }
  .topbtn { height: 21px; padding: 0 7px; gap: 5px; border-radius: 5px; color: var(--muted); font-size: 9.5px; }
  .topbtn.on { background: var(--selected); color: var(--fg); }
  #body { flex: 1; min-height: 0; display: flex; }
  #panewrap { flex: 1; min-width: 0; padding: 5px 4px 6px 6px; }
  #pane { height: 100%; border: 1px solid var(--accent); border-radius: 7px; background: var(--pane); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .phead { height: 22px; gap: 6px; padding: 0 9px; border-bottom: 1px solid #22252a; font-size: 9.5px; flex: none; }
  .phead .cwd { color: var(--dim); }
  #term { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 4px 10px 8px; font: 10.6px/13.5px var(--mono); color: var(--t-fg); white-space: pre; overflow: hidden; }
  .l { height: 13.5px; position: relative; }
  .dim { color: var(--t-dim); } .blue { color: var(--t-blue); } .green { color: var(--t-green); }
  .red { color: var(--t-red); } .yellow { color: var(--t-yellow); } .mauve { color: var(--t-mauve); } .orange { color: var(--claude); }
  .user { background: #29293a; margin: 0 -4px; padding: 0 4px; }
  .add { background: #2b3a36; margin: 0 -4px; padding: 0 4px; }
  .del { background: #3a2c3a; margin: 0 -4px; padding: 0 4px; }
  .sel { background: rgba(137, 180, 250, .38); color: #fff; }
  .rule { height: 1px; background: var(--t-blue); opacity: .75; margin: 6px 0; flex: none; }
  .caret { display: inline-block; width: 6.4px; height: 12px; background: #d2d4d9; vertical-align: -2px; }

  /* side panel */
  #panel { width: 262px; display: flex; flex-direction: column; border-left: 1px solid #16181b; }
  .ahead { height: 37px; padding: 0 10px; border-bottom: 1px solid var(--border); flex: none; display: flex; flex-direction: column; justify-content: center; }
  .ahead .title { font-size: 10px; font-weight: 600; }
  .ahead .count { font-size: 8px; color: var(--dim); }
  #list { flex: 1; min-height: 0; padding: 8px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  .empty { color: var(--dim); font-size: 9px; padding: 6px 4px; }
  .card { background: var(--pane); border: 1px solid var(--border); border-radius: 6px; padding: 7px; display: flex; flex-direction: column; gap: 5px; transform-origin: top; }
  .tag { align-self: flex-start; padding: 1px 5px; border-radius: 4px; font-size: 7.8px; font-weight: 600; color: var(--chrome); }
  .quote { background: var(--chrome); border-radius: 5px; padding: 4px 6px; font: 8.6px/12px var(--mono); color: var(--muted); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .comment { font-size: 9.2px; white-space: pre-wrap; }
  .undo { gap: 6px; padding: 5px 10px; border-top: 1px solid var(--border); color: var(--dim); font-size: 8.6px; }
  .pfoot { gap: 5px; padding: 7px 10px; border-top: 1px solid var(--border); }
  .btn { height: 19px; padding: 0 8px; border-radius: 5px; border: 1px solid var(--input); background: var(--raised); font-size: 9px; display: flex; align-items: center; white-space: nowrap; }
  .btn.primary { background: var(--solid); border-color: var(--solid); color: #111214; }
  .btn.press { filter: brightness(.82); transform: scale(.97); }

  #status { height: 22px; gap: 14px; padding: 0 8px; color: var(--muted); font-size: 9px; }
  #status .ico { color: var(--muted); }

  /* popup */
  .popup { position: absolute; background: var(--popover); border: 1px solid var(--input); border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.55); color: var(--fg); transform-origin: top left; }
  .bar { width: 307px; height: 34px; display: flex; align-items: center; gap: 4px; padding: 0 6px; font-size: 9.2px; }
  .item { height: 22px; padding: 0 7px; gap: 4px; border-radius: 5px; display: flex; align-items: center; white-space: nowrap; }
  .item .k { color: var(--dim); font-size: 8px; }
  .item.hot { background: #2c2f35; }
  .cbox { width: 307px; height: 124px; padding: 7px; display: flex; flex-direction: column; gap: 6px; font-size: 9.2px; }
  .field { border: 1px solid var(--accent); background: var(--chrome); border-radius: 5px; padding: 6px 7px; min-height: 26px; white-space: pre-wrap; line-height: 13px; }
  .field .ph { color: var(--dim); }
  .tcaret { display: inline-block; width: 1px; height: 11px; background: var(--fg); vertical-align: -2px; margin-left: 1px; }
  .hint { color: var(--dim); font-size: 7.7px; }

  #cursor { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 10; }
  #keys { position: absolute; right: 12px; bottom: 5px; display: flex; gap: 4px; z-index: 9; }
  .key { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 5px; background: #2b2e34; border: 1px solid #454a52; border-bottom-width: 2px; color: #f2f2f3; font: 600 10px/20px var(--sans); text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="claude" viewBox="0 0 16 12"><path fill="#d97757" d="M3 0h10v3h3v3h-3v3h-1v3h-2V9H6v3H4V9H3V6H0V3h3z M5 3v2h1V3z M10 3v2h1V3z"/></symbol>
    <symbol id="spin" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.2" fill="none" stroke="#4a4632" stroke-width="1.6"/><path d="M6 1.8a4.2 4.2 0 0 1 4.2 4.2" fill="none" stroke="#e5a247" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<div id="app">
  <div id="side">
    <div class="row brand">
      <svg width="15" height="15" viewBox="0 0 16 16"><rect width="16" height="16" rx="4" fill="#e9e9ea"/><path d="M4 11.5V4.5M12 11.5V4.5M4 8h8" stroke="#101114" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="grow">Herdr</span>
      <svg class="ico" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <svg class="ico" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M6 2.5v11"/></svg>
    </div>
    <div class="row label"><span class="grow">Spaces</span><span style="font-size:12px">+</span></div>
    <div class="row space on"><div class="badge" style="background:#3cc4a8">A</div>api</div>
    <div class="row space"><div class="badge" style="background:#e8915b">W</div>web</div>
    <div class="agents">

        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#71747c" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg></div>

      <div class="group" style="color:var(--dim)">Idle <span style="opacity:.7">1</span></div>
      <div class="row agent"><svg width="13" height="10"><use href="#claude"/></svg><span>web</span><span class="sub grow">· Dev server logs</span><span class="age">12m</span>
        <svg width="9" height="9" viewBox="0 0 12 12"><circle cx="6" cy="6" r="3.6" fill="none" stroke="#71747c" stroke-width="1.4"/></svg></div>
    </div>

      <div class="row agent"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>Settings</div>
      <div class="row agent"><span style="width:11px;text-align:center;font-size:12px">+</span>Add machine</div>

  <div id="main">

      <div class="topbtn row"><svg width="10" height="11" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 1.5h5.5L12 5v9.5H3z"/><path d="M8.5 1.5V5H12"/></svg>Files</div>
      <div class="topbtn row"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="4" cy="3.5" r="1.8"/><circle cx="12" cy="12.5" r="1.8"/><path d="M4 5.3v2.2a5 5 0 0 0 5 5h1.2"/></svg>Changes</div>
      <div class="topbtn row on"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3h12v8H7l-3 2.5V11H2z"/><path d="M5 6h6M5 8.3h4"/></svg>Annotate</div>
    </div>
    <div id="body">

      <span class="row" style="gap:5px"><svg class="ico" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="4" cy="3.5" r="1.8"/><circle cx="12" cy="5" r="1.8"/><path d="M4 5.3v9M12 6.8c0 3-8 2-8 5.5"/></svg>main</span>
      <span>• 2 agents</span><span class="grow"></span><span style="color:var(--dim)">Ctrl+Shift+P&nbsp; commands</span>
    </div>

</div>
<div id="popup"></div>
<svg id="cursor" width="18" height="22"></svg>

<script>
// Everything on screen is a pure function of the time t (seconds), so frames render exactly.
const LOOP = 16.6;
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const clamp = (x) => Math.max(0, Math.min(1, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2;
const typed = (s, t, a, b) => s.slice(0, Math.round(s.length * prog(t, a, b)));

// [class, text] terminal lines; SEL marks the two lines the pointer selects.
const SEL1 = "refreshToken() swallows the 401 and returns null;";
const SEL2 = "if (session.exp * 1000 < Date.now()) {";
const C1 = "Throw here instead of returning null.";
const C2 = "Callers can't tell a 401 from no session.";
const TRANSCRIPT = [
  ["", '<span class="green">●</span> <b>Bash</b>(npm test -- auth)'],
  ["", '  <span class="dim">⎿</span>  <span class="green">PASS</span> test/auth/login.test.ts'],
  ["", '     <span class="green">PASS</span> test/auth/session.test.ts'],
  ["", '     Tests: <span class="green">14 passed</span>, 14 total'], ["", ""],
  ["", "● All auth tests pass on this branch."], ["", ""],
  ["dim", "✻ Brewed for 9s · done 2:12 PM"], ["", ""],
  ["user", "❯ review src/auth/session.ts before I merge"], ["", ""],
  ["", '<span class="green">●</span> Read <b>1</b> file <span class="dim">(ctrl+o to expand)</span>'], ["", ""],
  ["", "● Three things in session.ts:"], ["", ""],
  ["", '  1. <span class="blue">session.ts:42</span> — exp is in seconds but is compared with'],
  ["", "     Date.now() in ms, so every session looks expired."],
  ["", '  2. <span class="blue">session.ts:58</span> — ', "sel1", "refreshToken() swallows the 401 and returns null;"],
  ["", "     callers then retry forever."],
  ["", '  3. <span class="blue">session.ts:71</span> — the cookie has no SameSite. Lax is enough.'], ["", ""],
  ["", "  Fix for 1:"],
  ["del", '    <span class="red">42 -</span> if (session.exp &lt; Date.now()) {'],
  ["add", '    <span class="green">42 +</span> ', "sel2", SEL2],
  ["", ""], ["", "  I'd fix 1 and 2 before merging; 3 can follow."], ["", ""],
  ["dim", "✻ Cogitated for 18s · done 2:14 PM"],
];
const SENT = ["Notes on your terminal output:", "", `> ${SEL1}`, C1, C2, "", `> ${SEL2}`, "✓ looks good"];

// Timeline (s)
const T = {
  move1: [0.3, 0.95], drag1: [1.0, 1.7], pop1: 2.05, keyC: 2.85,
  type1: [3.1, 4.3], shiftEnter: 4.45, type2: [4.65, 5.85], enter1: 6.2,
  move2: [6.55, 7.15], drag2: [7.2, 7.8], pop2: 8.15, keyA: 9.0,
  move3: [9.45, 10.2], click: 10.4, typeSend: [10.55, 11.35], submit: 11.65, end: LOOP,
};
const at = (t, k) => t >= T[k];

function lineHTML(l, t, selProg) {
  const [cls, pre, mark, text] = l;
  let body = pre;
  if (mark) {
    const p = selProg[mark] ?? 0, n = Math.round(text.length * p);
    body += `<span id="${mark}-a">${n ? `<span class="sel">${esc(text.slice(0, n))}</span>` : ""}</span><span id="${mark}-b">${esc(text.slice(n))}</span>`;
  }
  return `<div class="l ${cls}">${body || " "}</div>`;
}

function render(t, opts = {}) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const sent = at(t, "click") && !opts.noSend;
  const submitted = at(t, "submit") && sent;

  // selections stay highlighted until the next one starts (like a real terminal)
  const selProg = {};
  if (t >= T.drag1[0] && t < T.drag2[0]) selProg.sel1 = prog(t, ...T.drag1);
  if (t >= T.drag2[0] && !sent) selProg.sel2 = prog(t, ...T.drag2);
  if (opts.sel) Object.assign(selProg, opts.sel);

  // terminal
  let lines = TRANSCRIPT.map((l) => lineHTML(l, t, selProg));
  if (submitted) {
    lines.push('<div class="l"> </div>');
    SENT.forEach((s, i) => lines.push(`<div class="l user">${i ? "  " : "❯ "}${esc(s) || " "}</div>`));
    const secs = Math.max(1, Math.floor(t - T.submit) + 1);
    lines.push('<div class="l"> </div>', `<div class="l"><span class="orange">✻ Working…</span> <span class="dim">(${secs}s · esc to interrupt)</span></div>`);
  }
  let prompt = ['❯ <span class="caret"></span>'];
  if (sent && !submitted) {
    const all = SENT.join("\n"), shown = typed(all, t, ...T.typeSend).split("\n");
    prompt = shown.map((s, i) => (i ? "  " : "❯ ") + esc(s) + (i === shown.length - 1 ? '<span class="caret"></span>' : ""));
  }
  $("term").innerHTML = lines.join("") + '<div class="rule"></div>' + prompt.map((p) => `<div class="l">${p}</div>`).join("") +
    '<div class="rule"></div><div class="l">  <span style="color:#e4e4e7">⏵⏵ auto mode on</span> <span class="dim">(shift+tab to cycle)</span></div>';

  // annotations
  const card1 = { quote: SEL1, comment: `${C1}\n${C2}`, born: T.enter1 + 0.05 };
  const card2 = { quote: SEL2, kind: "ok", born: T.keyA + 0.05 };
  let cards = opts.cards ?? [card1, card2].filter((c) => t >= c.born);
  if (sent) cards = [];
  $("count").textContent = `${cards.length} annotation(s)`;
  $("list").innerHTML = cards.length ? cards.map((c) => {
    const p = ease(prog(t, c.born, c.born + 0.25));
    const tag = c.kind ? `<div class="tag" style="background:var(--${c.kind === "ok" ? "done" : "blocked"})">${c.kind === "ok" ? "✓ looks good" : "✗ remove/undo this"}</div>` : "";
    return `<div class="card" style="opacity:${opts.cards ? 1 : p};transform:translateY(${opts.cards ? 0 : (1 - p) * -6}px)">${tag}` +
      `<div class="quote">${esc(c.quote)}</div>${c.comment ? `<div class="comment">${esc(c.comment)}</div>` : ""}</div>`;
  }).join("") : '<div class="empty">Select text in this terminal to annotate it, or add a note.</div>';
  $("undo").innerHTML = sent ? '<div class="row undo"><span class="grow">2 sent to agent</span><div class="btn">Undo</div></div>' : "";
  const pressing = t >= T.click - 0.12 && t < T.click + 0.05;
  $("acts").style.visibility = cards.length ? "" : "hidden"; // kept in layout: the pointer aims at Send
  $("acts").innerHTML = `<div class="btn">Copy all</div><div id="send" class="btn primary${pressing ? " press" : ""}">Send to agent</div>`;

  // sidebar agent state
  $("grp").innerHTML = submitted ? '<span style="color:#e5a247">Working</span> <span style="color:var(--dim)">1</span>' : '<span style="color:#6f9fe0">Done</span> <span style="color:var(--dim)">1</span>';
  $("astat").innerHTML = submitted ? '<svg width="10" height="10"><use href="#spin"/></svg>' : '<svg width="9" height="9" viewBox="0 0 12 12"><circle cx="6" cy="6" r="3.4" fill="#6f9fe0"/></svg>';

  // pointer: anchor points come from the live layout
  const pt = (id) => { const r = $(id).getBoundingClientRect(); return [r.left, r.top + r.height / 2]; };
  const a1 = pt("sel1-a"), b1 = [$("sel1-a").getBoundingClientRect().right, a1[1]];
  const a2 = pt("sel2-a"), b2 = [$("sel2-a").getBoundingClientRect().right, a2[1]];
  const s = $("send").getBoundingClientRect(), sendPt = [s.left + s.width * .55, s.top + s.height * .6];
  const rest = [520, 470];
  const lerp = (p, q, x) => [p[0] + (q[0] - p[0]) * ease(x), p[1] + (q[1] - p[1]) * ease(x)];
  let cur = rest;
  if (t < T.drag1[0]) cur = lerp(rest, a1, prog(t, ...T.move1));
  else if (t < T.move2[0]) cur = [a1[0] + (b1[0] - a1[0]) * prog(t, ...T.drag1), a1[1]];
  else if (t < T.drag2[0]) cur = lerp(b1, a2, prog(t, ...T.move2));
  else if (t < T.move3[0]) cur = [a2[0] + (b2[0] - a2[0]) * prog(t, ...T.drag2), a2[1]];
  else cur = lerp(b2, sendPt, prog(t, ...T.move3));
  if (opts.cursor) cur = opts.cursor;
  const overPanel = cur[0] > $("panel").getBoundingClientRect().left;
  const c = $("cursor");
  c.innerHTML = overPanel
    ? '<path d="M2 1.5v15l4-3.6 2.6 6 2.4-1-2.6-5.8h5.4z" fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/>'
    : '<path d="M6 2h2.2M10.2 2H8.2M8.2 2v16M6 18h2.2M10.2 18H8.2" stroke="#000" stroke-width="3.2" stroke-linecap="round"/><path d="M6 2h2.2M10.2 2H8.2M8.2 2v16M6 18h2.2M10.2 18H8.2" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>';
  c.style.transform = overPanel ? `translate(${cur[0] - 2}px,${cur[1] - 1.5}px)` : `translate(${cur[0] - 8.2}px,${cur[1] - 10}px)`;

  // popup at the pointer where the drag ended
  let pop = "";
  const bar = (hot) => `<div class="bar">` + [["👍 looks good", "a"], ["💬 comment", "c"], ["✕ delete", "d"]]
    .map(([l, k]) => `<div class="item${hot === k ? " hot" : ""}">${l}<span class="k">(${k})</span></div>`).join("") + `</div>`;
  const place = (p, inner, born) => {
    const g = ease(prog(t, born, born + 0.12));
    return `<div class="popup" style="left:${Math.min(p[0] + 4, 1000 - 316)}px;top:${p[1] + 12}px;opacity:${g};transform:scale(${0.96 + 0.04 * g})">${inner}</div>`;
  };
  if (opts.popup) pop = opts.popup;
  else if (t >= T.pop1 && t < T.keyC + 0.05) pop = place(b1, bar(t >= T.keyC - 0.15 ? "c" : ""), T.pop1);
  else if (t >= T.keyC + 0.05 && t < T.enter1) {
    let txt = typed(C1, t, ...T.type1);
    if (at(t, "shiftEnter")) txt += "\n" + typed(C2, t, ...T.type2);
    const field = txt ? esc(txt) + '<span class="tcaret"></span>' : '<span class="tcaret"></span><span class="ph">Comment…</span>';
    pop = place(b1, `<div class="cbox"><div class="field">${field}</div><div class="hint">Enter save · Shift+Enter new line · Esc cancel</div>` +
      `<div class="row" style="margin-top:auto"><div class="grow"></div><div class="btn primary">Save</div></div></div>`, T.keyC + 0.05);
  } else if (t >= T.pop2 && t < T.keyA + 0.05) pop = place(b2, bar(t >= T.keyA - 0.15 ? "a" : ""), T.pop2);
  $("popup").innerHTML = pop;

  // key presses, shown as keycaps
  const keys = [["c", T.keyC], ["Shift + Enter", T.shiftEnter], ["Enter", T.enter1], ["a", T.keyA]];
  const k = opts.cursor ? null : keys.find(([, s]) => t >= s - 0.15 && t < s + 0.55);
  $("keys").innerHTML = k ? k[0].split(" + ").map((x) => `<div class="key">${x}</div>`).join('<div style="color:#aaa;font:600 11px/22px var(--sans)">+</div>') : "";
}

// The still for preview.png: the bar open over a selection, two cards in the panel.
function preview() {
  render(8.4, {
    cards: [
      { quote: SEL1, comment: `${C1}\n${C2}` },
      { quote: "3. session.ts:71 — the cookie has no SameSite. Lax is enough.", comment: "Do this one in the same PR." },
    ],
  });
}
window.render = render; window.preview = preview; window.LOOP = LOOP;
const h = new URLSearchParams(location.hash.slice(1));
if (h.has("preview")) preview(); else render(Number(h.get("t") ?? 8.4));
</script>
